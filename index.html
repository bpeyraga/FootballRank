<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranking Fútbol</title>
<meta name="theme-color" content="#f1f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1712" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranking Fútbol">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script>
try {
  var t = JSON.parse(localStorage.getItem('fr-theme') || 'null'), e = document.documentElement;
  if (t) {
    if (t.mode === 'light' || t.mode === 'dark') e.setAttribute('data-theme', t.mode);
    if (t.palette && t.palette !== 'cancha' && (t.palette !== 'club' || t.club)) e.setAttribute('data-palette', t.palette);
    if (t.palette === 'club' && t.club) {
      e.style.setProperty('--club', t.club.c); e.style.setProperty('--club-fg', t.club.fg);
      e.style.setProperty('--club-d', t.club.d); e.style.setProperty('--club-d-fg', t.club.dfg);
    }
  }
} catch (_) {}
</script>
</head>
<body><div id="app"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
