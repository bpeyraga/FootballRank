<script>
try {
  // Aplica el tema ya resuelto por la app (src/features/theme/theme.ts → bootOf), sin lógica propia, para que no parpadee.
  var b = (JSON.parse(localStorage.getItem('fr-theme') || 'null') || {}).boot, e = document.documentElement;
  if (b) {
    if (b.theme) e.setAttribute('data-theme', b.theme);
    if (b.palette) e.setAttribute('data-palette', b.palette);
    for (var k in b.vars) e.style.setProperty(k, b.vars[k]);
  }
} catch (_) {}
</script>
